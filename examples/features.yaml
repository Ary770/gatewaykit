# Follow-up feature demo; independent of the core demo on port 8080.
gateway:
  port: 18080
  global_timeout: "2s"
routes:
  - path: /transform
    methods: [POST]
    strip_prefix: true
    upstream:
      url: "http://127.0.0.1:13001"
    request_transform:
      headers:
        add: {X-Gateway: gatewaykit}
        remove: [X-Debug]
      body:
        mapping:
          user.id: userId
          user.name: userName
    response_transform:
      headers:
        add: {X-Served-By: gatewaykit}
      body:
        envelope:
          data: "$body"
          route: "$route_path"
  - path: /retry
    methods: [GET]
    strip_prefix: true
    upstream:
      targets:
        - url: "http://127.0.0.1:13001?status=503"
        - url: "http://127.0.0.1:13002"
      balance: round_robin
    retry:
      attempts: 2
      backoff: fixed
      initial_delay: "10ms"
      on: [503]
  - path: /healthy
    methods: [GET]
    strip_prefix: true
    upstream:
      targets:
        - url: "http://127.0.0.1:13002"
        - url: "http://127.0.0.1:13001"
      balance: round_robin
    health_check:
      path: /healthz
      interval: "50ms"
      unhealthy_threshold: 1
  - path: /breaker
    methods: [GET]
    strip_prefix: true
    upstream:
      url: "http://127.0.0.1:13001?status=503"
    circuit_breaker:
      threshold: 2
      window: "30s"
      cooldown: "30s"
